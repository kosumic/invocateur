[package]
name = "invocateur"
autobins = false
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Summon coding agents from your GitHub comments"

[[bin]]
name = "invo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hostname = "0.4"
chrono-tz = "0.10"
croner = "4"
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tiny_http = "0.12"
ureq = { version = "3.5", default-features = false, features = ["json"] }
getrandom = "0.4"
subtle = "2.6"
