[package]
name = "invocateur"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Summon coding agents from your GitHub comments"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
