version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 1
    open-pull-requests-limit: 8
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-compatible:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
      cargo-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 1
    open-pull-requests-limit: 8
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
